services:
  mysql:
    image: mysql:8.0
    container_name: ticket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticket_booking_db
      MYSQL_USER: ticket_user_1
      MYSQL_PASSWORD: ticket_password
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5 

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ticket-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "443:3000"
      - "80:3001"

    env_file:
      - .env
    environment:
      DB_HOST: mysql
      HTTPS_PORT: 3000
      HTTP_PORT: 3001
      SSL_KEY_PATH: /app/certs/server.key
      SSL_CERT_PATH: /app/certs/server.crt

    volumes:
      - ./certs:/app/certs:ro

    command: ["node", "src/server.js"]

volumes:
  mysql_data: {}

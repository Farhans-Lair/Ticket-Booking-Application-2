name: CI - Test, Build & Push Backend Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'terraform/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches unresolved merge conflict markers (<<<<<<<, =======, >>>>>>>)
      # before they can reach a migration, schema file, or any other
      # committed content. This runs first and blocks test/deploy entirely
      # if it fails, rather than letting a bad merge silently ship and
      # crash-loop in production.
      - name: Check for unresolved merge conflict markers
        run: |
          if grep -rn "^<<<<<<<\|^=======\|^>>>>>>>" \
              --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Unresolved merge conflict markers found. Fix before continuing."
            exit 1
          fi
          echo "No conflict markers found."

  test:
    needs: checks
    runs-on: ubuntu-latest

    env:
      DB_HOST:     127.0.0.1
      DB_PORT:     3306
      DB_NAME:     ticket_booking_db
      DB_USER:     ticket_user_1
      DB_PASSWORD: ticket_password
      NODE_ENV:    test
      JWT_SECRET:  ci_test_jwt_secret_not_used_in_prod
      RAZORPAY_KEY_ID:     rzp_test_placeholder_for_ci
      RAZORPAY_KEY_SECRET: placeholder_secret_for_ci
      EMAIL_USER:  ci@example.com
      EMAIL_PASS:  ci_placeholder
      S3_BUCKET_NAME: ci-placeholder-bucket

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ticket_booking_db
          MYSQL_USER:     ticket_user_1
          MYSQL_PASSWORD: ticket_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MySQL Client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -prootpassword && break
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Load database schema
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword ticket_booking_db \
            < db/master_schema.sql
          echo "Schema loaded successfully"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Reads non-sensitive bootstrap config from terraform/terraform.tfvars
      # instead of hardcoding it here, so Terraform and CI can never drift
      # out of sync on account ID / region / role naming. Written to
      # $GITHUB_ENV so every later step in this job can use $AWS_REGION /
      # $AWS_ACCOUNT_ID / $ECR_REPOSITORY as plain shell variables, same
      # as before.
      - name: Load config from terraform.tfvars
        run: |
          TFVARS=terraform/terraform.tfvars
          get() { grep -E "^\s*$1\s*=" "$TFVARS" | sed -E 's/^[^=]+=\s*"?([^"]*)"?\s*$/\1/'; }

          PROJECT_NAME=$(get project_name)

          echo "AWS_REGION=$(get aws_region)"         >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=$(get aws_account_id)" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME"            >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${PROJECT_NAME}-backend" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}-GitHubActions-ECR-Push-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Verify ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION
          echo "ECR repository confirmed."

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}
          IMAGE_URI=${REGISTRY}:latest
          IMAGE_SHA_URI=${REGISTRY}:${{ github.sha }}

          docker build \
            -f backend/Dockerfile \
            -t $IMAGE_URI \
            -t $IMAGE_SHA_URI \
            .

          # Push a git-sha tag alongside :latest so there's always a known-good
          # tag to roll back to if a bad build ends up on :latest.
          docker push $IMAGE_URI
          docker push $IMAGE_SHA_URI

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest

          # Loop over every running instance in the ASG, not just the first
          # one returned — with the ASG able to scale to 3 instances, a
          # single-instance deploy left the rest on the old image until
          # they were naturally replaced.
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region $AWS_REGION \
            --filters "Name=tag:Name,Values=ticket*" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running EC2 instance found."
            echo "Image pushed to ECR successfully."
            echo "Run: terraform apply (full) to create infrastructure."
            echo "EC2 will pull this image automatically on first boot."
            exit 0
          fi

          echo "Deploying to instances: $INSTANCE_IDS"

          # Build the SSM command payload as real JSON instead of the
          # malformed commands=[...] shorthand, which the AWS CLI's
          # shorthand parser can mis-handle when commands span multiple
          # lines.
          cat > /tmp/ssm-params.json << EOF
          {
            "Parameters": {
              "commands": [
                "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com",
                "docker pull ${IMAGE_URI}",
                "docker rm -f ticket-backend || true",
                "docker run -d --name ticket-backend --restart always --env-file /home/ec2-user/ticket-backend/.env -p 3000:3000 -v /home/ec2-user/ticket-backend/logs:/app/logs ${IMAGE_URI}"
              ]
            }
          }
          EOF

          FAILED=0

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "── Deploying to $INSTANCE_ID ──"

            COMMAND_ID=$(aws ssm send-command \
              --region $AWS_REGION \
              --instance-ids $INSTANCE_ID \
              --document-name "AWS-RunShellScript" \
              --cli-input-json file:///tmp/ssm-params.json \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            STATUS="Pending"
            for i in {1..18}; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --region $AWS_REGION \
                --query "Status" --output text 2>/dev/null || echo "Pending")
              echo "Deploy status ($i/18) on $INSTANCE_ID: $STATUS"
              [ "$STATUS" = "Success" ] && break
              [ "$STATUS" = "Failed" ]  && break
              sleep 10
            done

            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --region $AWS_REGION \
              --query "[StandardOutputContent, StandardErrorContent]" \
              --output text

            if [ "$STATUS" != "Success" ]; then
              echo "Deploy failed on $INSTANCE_ID"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more instances failed to deploy."
            exit 1
          fi
